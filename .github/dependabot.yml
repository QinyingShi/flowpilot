version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 4
    groups:
      react-runtime:
        patterns:
          - react
          - react-dom
          - react-server-dom-webpack
        update-types:
          - patch
      vinext-runtime:
        patterns:
          - vinext
          - '@vitejs/plugin-rsc'
        update-types:
          - patch
      cloudflare-toolchain:
        patterns:
          - '@cloudflare/*'
          - wrangler
        update-types:
          - patch
      frontend-patch:
        patterns:
          - '*'
        exclude-patterns:
          - react
          - react-dom
          - react-server-dom-webpack
          - vinext
          - '@vitejs/plugin-rsc'
          - '@cloudflare/*'
          - wrangler
        update-types:
          - patch
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      backend-patch:
        patterns:
          - '*'
        update-types:
          - patch
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
