name: 缺陷报告
description: 报告可复现的功能问题
title: '[Bug] '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 安全漏洞请使用仓库的私密 Security Advisory，不要在这里披露。
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 实际发生了什么？你期望发生什么？
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开…
        2. 点击…
        3. 看到…
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本或提交
      placeholder: 0.1.0-alpha / commit SHA
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境
      description: 操作系统、浏览器、Node.js、Python 和部署方式。
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 日志或截图
      description: 请先移除密钥、邮箱和真实项目数据。
